<div class="relative">
    <label for="date-picker" class="block text-sm font-medium text-gray-700 mb-1">
        {{ label }}
    </label>

    <div class="relative">
        <input type="text" id="date-picker" [attr.readonly]="readonly ? true : null"
            class="block w-full px-4 py-2 text-gray-700 bg-white border disabled:cursor-not-allowed disabled:text-red-700 border-gray-300 rounded-lg shadow-sm cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-800"
            [placeholder]="placeholder ?? dateFormat" [(value)]="value" [attr.disabled]="disabled ? true : null"
            (click)="readonly ? toggleCalendar() : null" />
        <button
            class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer disabled:cursor-not-allowed disabled:text-gray-300"
            [disabled]="disabled" (click)="toggleCalendar()">
            <svg xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-gray-500 hover:text-gray-700 disabled:hover:text-gray-500" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        </button>
    </div>
    <lucy-calendar [calendarVisible]="showCalendar" [label]="label" [placeholder]="placeholder" [dateValue]="dateValue"
        (dateValueChange)="dateChange($event)" (valueChange)="valueChange.emit($event)" [dateFormat]="dateFormat"
        [dateFormat]="dateFormat"></lucy-calendar>
    <!-- } -->
</div>
