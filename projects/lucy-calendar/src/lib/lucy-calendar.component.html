<div class="relative">
  <label for="date-picker" class="block text-sm font-medium text-gray-700 mb-1">
    {{ label }}
  </label>

  <div class="relative">
    <input type="text" id="date-picker" [attr.readonly]="readonly ? true : null"
      class="block w-full px-4 py-2 text-gray-700 bg-white border disabled:cursor-not-allowed disabled:text-red-700 border-gray-300 rounded-lg shadow-sm cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-800"
      [placeholder]="placeholder ?? dateFormat" [value]="selectedDay !== 0 ? formatDate() : null"
      [attr.disabled]="disabled ? true : null" (click)="readonly ? toggleCalendar() : null" />
    <button
      class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer disabled:cursor-not-allowed disabled:text-gray-300"
      [disabled]="disabled" (click)="toggleCalendar()">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-gray-500 hover:text-gray-700 disabled:hover:text-gray-500" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M3 8h18M3 20h18V8H3v12zm0-12h18v4H3V8z" />
      </svg>
    </button>
  </div>

  <!-- Calendar Dropdown -->
  <div id="calendar" class="absolute mt-1 w-64 bg-white border border-gray-300 rounded-lg shadow-lg p-4 z-10"
    [ngClass]="{'hidden': !calendarVisible}">
    <div class="flex justify-between items-center mb-2">
      <button (click)="prevMonth()"
        class="text-gray-500 hover:text-gray-700 disabled:text-gray-300 disabled:cursor-not-allowed"
        [disabled]="isPrevMonthDisabled()">
        <svg class="h-6 w-6 text-gray-500 hover:text-gray-700 disabled:text-gray-300" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <!-- (click)="toggleMonthYearSelection()" -->
      <button class="font-medium text-gray-700">
        {{ monthNames[selectedMonth - 1] }} {{ selectedYear }}
      </button>
      <button (click)="nextMonth()"
        class="text-gray-500 hover:text-gray-700 disabled:text-gray-300 disabled:cursor-not-allowed"
        [disabled]="isNextMonthDisabled()">
        <svg class="h-6 w-6 text-gray-500 hover:text-gray-700 disabled:text-gray-300" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <lucy-dropdown [options]="filteredMonths" [selected]="selectedMonth" (selectedChange)="onMonthChanges($event)"
        [displayFn]="monthDisplay">
      </lucy-dropdown>
      <lucy-dropdown [options]="filteredYears" [selected]="selectedYear"
        (selectedChange)="onYearChanges($event)"></lucy-dropdown>
    </div>

    <!-- Days of the Month -->
    <div class="grid grid-cols-7 gap-1 text-center text-sm">
      <div *ngFor="let dayName of dayNames" class="text-gray-500">{{ dayName }}</div>
    </div>

    <div class="grid grid-cols-7 gap-1 text-center text-sm pt-2">
      <div *ngFor="let empty of getLeadingEmptyDays()"></div>
      <button *ngFor="let day of daysInMonth" class="py-1 rounded hover:bg-indigo-100 focus:bg-indigo-200"
        [ngClass]="{'bg-blue-200': day === selectedDay, 'bg-gray-200 text-gray-400 cursor-not-allowed': isDayDisabled(day)}"
        [disabled]="isDayDisabled(day)" (click)="selectDate(day)">
        {{ day }}
      </button>
    </div>

    <div class="flex justify-between mt-2">
      <button (click)="clearDate()"
        class="px-2 py-1 border border-red-500 text-red-500 rounded text-xs hover:bg-red-100">Clear</button>
      <button (click)="selectToday()"
        class="px-2 py-1 border border-blue-500 text-blue-500 rounded text-xs hover:bg-blue-100">Today</button>
    </div>
  </div>
</div>
