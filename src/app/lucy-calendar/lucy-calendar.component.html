<div class="relative w-64">
  <label for="date-picker" class="block text-sm font-medium text-gray-700 mb-1">
    {{ label }}
  </label>
  <div class="relative">
    <input type="text" id="date-picker" readonly
      class="block w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg shadow-sm cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-800"
      [placeholder]="placeholder" (click)="toggleCalendar()" [value]="selectedDateEt ? (selectedDateEt) : ''" />
    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 hover:text-gray-700" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M3 8h18M3 20h18V8H3v12zm0-12h18v4H3V8z" />
      </svg>
    </div>
  </div>

  <!-- Calendar Dropdown -->
  <div id="calendar" class="absolute mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-lg p-4 z-10"
    [ngClass]="{'hidden': !calendarVisible}">
    <div class="flex justify-between items-center mb-2">
      <button (click)="prevMonth()" class="text-gray-500 hover:text-gray-700"><svg
          class="h-6 w-6 text-gray-500 hover:text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <button (click)="toggleMonthYearSelection()" class="font-medium text-gray-700">
        {{ monthNames[selectedMonth - 1] }} {{ selectedYear }}
      </button>
      <button (click)="nextMonth()" class="text-gray-500 hover:text-gray-700" [disabled]="isNextMonthDisabled()"><svg
          class="h-6 w-6 text-gray-500 hover:text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <!-- Combined Dropdown -->
    <div>
      <div class="flex flex-col space-y-2">
        <!-- Month-Year Combined Dropdown -->
        <div class="overflow-y-auto"> <!-- Adjust max-h to fit your needs -->
          <div class="grid grid-cols-2 gap-2 ">
            <!-- Month Dropdown -->

            <!-- class="inline-flex w-full justify-center gap-x-1.5 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 ring-1 shadow-xs ring-gray-300 ring-inset hover:bg-gray-50" -->
            <div>
              <!-- <label class="block text-sm font-medium text-gray-700 mb-1">ወር</label> -->
              <select [(ngModel)]="selectedMonth" (change)="onMonthChange($event)"
                class="block text-sm w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none">
                <option *ngFor="let month of monthNames; let i = index" [value]="i + 1"
                  [disabled]="isMonthOptionDisabled(i)" [ngClass]="{'text-gray-400': isMonthOptionDisabled(i)}">
                  {{ month }}
                </option>
              </select>
            </div>

            <!-- Year Dropdown -->
            <div class="max-h-1">
              <!-- <label class="block text-sm font-medium text-gray-700 mb-1">አመት</label> -->
              <select [(ngModel)]="selectedYear" (change)="onYearChange($event)" [attr.size]="1"
                class="block text-sm w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none">
                <option *ngFor="let year of availableYears" [value]="year">{{ year }}</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Days of the Month -->
    <div class="grid grid-cols-7 gap-1 text-center text-sm">
      <div *ngFor="let dayName of dayNames" class="text-gray-500">{{ dayName }}</div>
    </div>

    <div class="grid grid-cols-7 gap-1 text-center text-sm pt-2">
      <div *ngFor="let empty of getLeadingEmptyDays()"></div>
      <button *ngFor="let day of daysInMonth" class="py-1 rounded hover:bg-indigo-100 focus:bg-indigo-200"
        [ngClass]="{'bg-blue-200': day === selectedDay, 'bg-gray-200 text-gray-400 cursor-not-allowed': isDayDisabled(day)}"
        [disabled]="isDayDisabled(day)" (click)="selectDate(day)">
        {{ day }}
      </button>
    </div>

    <div class="flex justify-end mt-4">
      <button (click)="clearDate()"
        class="px-2 py-1 border border-red-500 text-red-500 rounded text-xs hover:bg-red-100">Clear</button>
    </div>
  </div>
</div>
