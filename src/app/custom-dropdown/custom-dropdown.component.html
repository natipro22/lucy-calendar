<div class="relative inline-block w-full" #dropdownContainer>
    <!-- Dropdown Button -->
    <button (click)="toggleDropdown($event)"
        class="w-full px-3 py-2 text-center text-gray-700 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none">
        {{ displayFn ? displayFn(selected) : selected }}
        <svg class="w-4 h-4 inline-block ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </button>

    <!-- Dropdown List -->
    <div *ngIf="dropdownOpen"
        class="absolute z-10 mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto custom-scrollbar">
        <ul>
            <li *ngFor="let option of options; let i = index" (click)="onOptionClick(option, i)"
                class="px-4 py-2 cursor-pointer hover:bg-gray-100">
                {{ displayFn ? displayFn(option) : option }}
            </li>
        </ul>
    </div>
</div>
